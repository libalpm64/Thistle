[workspace]
authors = ["libalpm64 <159192189+libalpm64@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "Thistle"
platforms = ["linux-64", "osx-arm64"]
version = "1.0.2"

[tasks]
test = "mojo run -I src/ tests/thistle_test_vectors.mojo"
dudect = "mojo run -I src/ tests/dudect.mojo"
test-ml-kem = "mojo run -I src/ tests/test_ml_kem.mojo"
test-ml-dsa = "mojo run -I src/ tests/test_ml_dsa.mojo"
bench = "mojo run -I src/ tests/benchmark.mojo"

[dependencies]
python = "3.12.*"
max = "==26.4.0"
mojo = ">=1.0.0b2,<2"
